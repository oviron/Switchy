name: Build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Linux, gcc and clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./build.sh test
      - run: HOSTCC=clang ./build.sh test

  mingw:
    name: Build (MinGW-w64 GCC, portability check)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Switchy-gcc
          path: build/Switchy.exe

  clang:
    name: Build (LLVM-MinGW clang, release binary)
    runs-on: ubuntu-latest
    needs: test
    env:
      LLVM_MINGW: '20261006'
    steps:
      - uses: actions/checkout@v5
      - name: Install llvm-mingw ${{ env.LLVM_MINGW }}
        run: |
          url=$(curl -fsSL "https://api.github.com/repos/mstorsjo/llvm-mingw/releases/tags/$LLVM_MINGW" |
                jq -r '.assets[].browser_download_url | select(test("ucrt-ubuntu-[0-9.]+-x86_64\\.tar\\.xz$"))' | head -1)
          test -n "$url"
          curl -fsSL "$url" | tar xJ
          echo "$PWD/$(ls -d llvm-mingw-*/ | head -1)bin" >> "$GITHUB_PATH"
      - run: CC=x86_64-w64-mingw32-clang ./build.sh
      - name: Check imports and PE security flags
        run: |
          # only KnownDLLs: the elevated helper may run from Downloads, next to a planted DLL
          dlls=$(llvm-readobj --coff-imports build/Switchy.exe | sed -n 's/^ *Name: \(.*\.dll\)$/\1/p' | tr 'A-Z' 'a-z' | sort | tr '\n' ' ')
          echo "imports: $dlls"
          test "$dlls" = "advapi32.dll gdi32.dll kernel32.dll shell32.dll user32.dll "
          flags=$(llvm-readobj --file-headers build/Switchy.exe)
          for f in IMAGE_DLL_CHARACTERISTICS_DYNAMIC_BASE IMAGE_DLL_CHARACTERISTICS_NX_COMPAT IMAGE_DLL_CHARACTERISTICS_HIGH_ENTROPY_VA; do
            echo "$flags" | grep -q "$f" || { echo "missing $f"; exit 1; }
          done
      - run: cd build && sha256sum Switchy.exe | tee Switchy.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Switchy
          path: |
            build/Switchy.exe
            build/Switchy.exe.sha256

  msvc:
    name: Build (MSVC)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: microsoft/setup-msbuild@v2
      - name: Unit tests (MSVC)
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          mkdir build
          cl /nologo /W4 /WX /Isrc tests\test_logic.c src\logic.c /Fobuild\ /Febuild\test_logic.exe || exit /b 1
          build\test_logic.exe
      - run: msbuild Switchy.sln /m /p:Configuration=Release /p:Platform=x64
      - uses: actions/upload-artifact@v4
        with:
          name: Switchy-msvc
          path: x64/Release/Switchy.exe

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [ clang, mingw, msvc ]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Switchy
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Switchy.exe
            Switchy.exe.sha256
